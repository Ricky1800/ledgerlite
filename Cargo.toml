[package]
name = "ledgerlite"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "A fast, private, offline CLI that turns bank/credit-card CSV exports into categorized books and a profit-and-loss report."
license = "MIT"
authors = ["Ricky1800", "orbitwebsites-cloud"]
repository = "https://github.com/Ricky1800/ledgerlite"
readme = "README.md"
keywords = ["bookkeeping", "cli", "csv", "finance", "small-business"]
categories = ["command-line-utilities", "finance"]

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
anyhow = "1"
thiserror = "1"
comfy-table = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rust_decimal_macros = "1"

[[bin]]
name = "ledgerlite"
path = "src/main.rs"

[lib]
name = "ledgerlite"
path = "src/lib.rs"
